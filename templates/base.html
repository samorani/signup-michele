<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Office Hours{% endblock %} - Office-hours sign-up</title>
  <style>
    :root { --ink: #1f2933; --muted: #52606d; --line: #d9e2ec; --accent: #1f6feb; --accent-dark: #1a5fcc; --bg: #f5f7fa; --card: #ffffff; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: var(--bg); color: var(--ink); line-height: 1.5; }
    nav { display: flex; gap: 1.25rem; align-items: center; background: var(--ink); color: #fff; padding: 0.75rem 1.5rem; }
    nav a { color: #fff; text-decoration: none; font-weight: 600; }
    nav a:hover { text-decoration: underline; }
    nav .spacer { flex: 1; }
    nav span { color: #cbd2d9; }
    nav strong { color: #fff; }
    nav form { display: inline; }
    nav button { margin: 0; padding: 0.3rem 0.8rem; background: transparent; color: #fff; border: 1px solid #9aa5b1; }
    nav button:hover { background: #fff; color: var(--ink); }
    body > .flash, body > h1, body > p, body > form, body > table { margin-left: auto; margin-right: auto; }
    body > h1, body > p, body > form, body > .flash { max-width: 40rem; }
    body > table { max-width: 64rem; }
    h1 { font-size: 1.6rem; margin: 2rem auto 0.75rem; padding: 0 1rem; }
    body > p { padding: 0 1rem; color: var(--muted); }
    .flash { background: #fff4ce; border: 1px solid #f0c36d; color: #5c4400; padding: 0.6rem 1rem; margin-top: 1.5rem; border-radius: 6px; }
    body > form { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 1.25rem 1.5rem; margin: 0 auto 1rem; width: calc(100% - 2rem); }
    label { display: block; margin-top: 0.75rem; font-weight: 600; }
    input[type=text], input[type=password] { width: 100%; padding: 0.5rem 0.6rem; margin-top: 0.25rem; border: 1px solid #9aa5b1; border-radius: 6px; font-size: 1rem; }
    input[type=text]:focus, input[type=password]:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
    button { margin-top: 1rem; padding: 0.5rem 1.1rem; font-size: 0.95rem; cursor: pointer; background: var(--accent); color: #fff; border: 0; border-radius: 6px; }
    button:hover { background: var(--accent-dark); }
    a { color: var(--accent); }
    table.sheet { border-collapse: separate; border-spacing: 0; table-layout: fixed; width: calc(100% - 2rem); margin: 0 auto 2rem; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    table.sheet th, table.sheet td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0.6rem 0.5rem; text-align: center; vertical-align: middle; }
    table.sheet th:last-child, table.sheet td:last-child { border-right: 0; }
    table.sheet tbody tr:last-child th, table.sheet tbody tr:last-child td { border-bottom: 0; }
    table.sheet thead th { background: #e4e9f0; font-weight: 600; } table.sheet th:first-child { width: 11.5rem; }
    table.sheet tbody th { text-align: left; white-space: nowrap; background: #f0f3f7; font-weight: 600; color: var(--muted); }
    table.sheet td form { display: inline; }
    table.sheet td button { margin: 0.25rem 0 0; padding: 0.25rem 0.7rem; font-size: 0.85rem; }
    table.sheet td.free button { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
    table.sheet td.free button:hover { background: var(--accent); color: #fff; }
    table.sheet td.mine { background: #dcf5e3; color: #14532d; font-weight: 600; }
    table.sheet td.mine button { background: #fff; color: #14532d; border: 1px solid #14532d; font-weight: 400; }
    table.sheet td.taken { background: #f0f3f7; color: var(--muted); }
    table.sheet td.taken button { background: #fff; color: var(--muted); border: 1px solid #9aa5b1; }
    @media (max-width: 40rem) { nav { flex-wrap: wrap; gap: 0.75rem 1rem; } table.sheet th, table.sheet td { padding: 0.4rem 0.25rem; font-size: 0.85rem; } }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}">Home</a>
    {% if g.user %}<a href="{{ url_for('sheet') }}">Sign-up sheet</a>{% endif %}
    <span class="spacer"></span>
    {% if g.user %}
      <span>Logged in as <strong>{{ g.user['username'] }}</strong></span>
      <form method="post" action="{{ url_for('logout') }}">
        <button type="submit">Log out</button>
      </form>
    {% else %}
      <a href="{{ url_for('register') }}">Register</a>
      <a href="{{ url_for('login') }}">Log in</a>
    {% endif %}
  </nav>

  {% for message in get_flashed_messages() %}
    <div class="flash">{{ message }}</div>
  {% endfor %}

  {% block content %}{% endblock %}
</body>
</html>
